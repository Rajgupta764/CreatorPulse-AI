services:
  postgres:
    image: postgres:18-alpine
    container_name: viralforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: viralforge
      POSTGRES_PASSWORD: viralforge
      POSTGRES_DB: viralforge
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
