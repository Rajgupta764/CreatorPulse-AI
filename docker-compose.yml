version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorpulse-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: creatorpulse
      POSTGRES_PASSWORD: creatorpulse
      POSTGRES_DB: creatorpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
